name: Ji

options:
  bundleIdPrefix: com.sbcnmsc
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Ji:
    type: application
    platform: iOS
    sources:
      - path: ji-ios/Ji
        excludes:
          - Info.plist
      # 网页本体：直接用 ji-app/index.html，网页和 App 永远是同一份
      - path: ji-app/index.html
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ji-ios/Ji/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sbcnmsc.ji
        PRODUCT_NAME: Ji
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
